apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: statefulset
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: "database"
      minAllowed:
        memory: 250Mi
      maxAllowed:
        memory: 1Gi
      controlledResources:
      - memory
      controlledValues: RequestsAndLimits