# HA производится через оператора
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: ""

auth:
  name: admin
  password: password
  database: project_db
  existingSecret: ""

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

config:
  max_connections: 200
  shared_buffers: "128MB"

mount:
  path: "/var/lib/postgresql/data"
  pgdata: "/var/lib/postgresql/data/pgdata"

nodeSelector: {}
tolerations: []
affinity: {}