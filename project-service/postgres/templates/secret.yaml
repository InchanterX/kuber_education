apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "postgres.secretName" .) }}
{{- $password := "" }}
{{- if $existing }}
{{-   $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{-   $password = randAlphaNum 20 }}
{{- end }}
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}