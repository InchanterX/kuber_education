{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "project.ingress" . }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /project
        pathType: Prefix
        backend:
          service:
            name: {{ include "project.service" . }}
            port:
              number: {{ .Values.port }}
{{- end }}