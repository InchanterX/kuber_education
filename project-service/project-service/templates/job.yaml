{{- include "project.validateValues" .}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "project.migration" . }}
  labels:
    {{- include "project.labels" . | nindent 4}}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 240
      containers:
      - name: {{ include "project.migration" . }}
        image: {{ include "project.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: PG_USER
          value: {{ include "project.pg_user" . | quote }}
        - name: PG_HOST
          value: {{ .Values.postgres.host | default (include "project.postgres_host" .) | quote }}
        - name: PG_PORT
          value: {{ include "project.pg_port" . | quote }}
        - name: PG_DB
          value: {{ include "project.pg_database" . | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.secretName | default (include "project.postgres_secretName" .) }}
              key: {{ .Values.postgres.secretKey}}
        - name: DATABASE_DSN
          value: postgresql://$(PG_USER):$(POSTGRES_PASSWORD)@$(PG_HOST):$(PG_PORT)/$(PG_DB)
        command: ["uv", "run", "-m", "src.main", "migrate"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8}}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- . | toYaml | nindent 8}}
      {{- end }}