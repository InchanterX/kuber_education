{{- include "redpanda.validateValues" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redpanda.fullname" . }}
  labels:
    {{- include "redpanda.labels" . | nindent 4}}
spec:
  selector:
    matchLabels:
      {{- include "redpanda.selectorLabels" . | nindent 6}}
  serviceName: {{ include "redpanda.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        {{- include "redpanda.labels" . | nindent 8}}
    spec:
      initContainers:
      - name: fix-permissions
        image: {{ include "redpanda.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "-c", "chown -R 101:101 {{ .Values.mount.path }}"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: {{ include "redpanda.fullname" . }}
          mountPath: {{ .Values.mount.path }}
      containers:
      - name: {{ include "redpanda.name" . }}
        image: {{ include "redpanda.image" .}}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.config }}
        command:
          - /bin/sh
          - -c
          - >
            exec rpk redpanda start
            --overprovisioned
            --check=false
            --advertise-kafka-addr ${POD_NAME}.{{ include "redpanda.headlessName" $ }}.${POD_NAMESPACE}.svc.cluster.local:9092
            {{- range $key, $value := .parameters }}
            --{{ $key | replace "_" "-" }} {{ $value }}
            {{- end }}
            --default-log-level={{ .default_log_level }}
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: kafka-api
          containerPort: {{ include "redpanda.kafka_port" . }}
        - name: admin-api
          containerPort: {{ .Values.ports.admin_api }}
        - name: rpc
          containerPort: {{ .Values.ports.rpc }}
        readinessProbe:
          httpGet:
            path: /v1/status/ready
            port: admin-api
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /v1/status/ready
            port: admin-api
        volumeMounts:
        - name: {{ include "redpanda.fullname" . }}
          mountPath: {{ .Values.mount.path }}
      securityContext:
          runAsUser: 101
          runAsGroup: 101
          fsGroup: 101
          fsGroupChangePolicy: "OnRootMismatch"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8}}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- . | toYaml | nindent 8}}
      {{- end }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: {{ include "redpanda.fullname" .}}
          emptyDir: {}
      {{- end}}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ include "redpanda.fullname" . }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end}}