apiVersion: v1
kind: Pod
metadata:
  name: demo-app
  namespace:
spec:
  containers:
    - name: demo-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: config-name
      env:
        - name: JWT_ISSUER_SECOND
          valueFrom:
            configMapKeyRef:
              name: config-name
              key: JWT_ISSUER