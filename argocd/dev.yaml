apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-service-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services-project

  source:
    repoURL: https://github.com/InchanterX/kuber_education.git
    targetRevision: main
    path: kustomize_base/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: project-service-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas