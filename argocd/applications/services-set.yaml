apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/InchanterX/kuber_education.git
        revision: main
        directories:
          - path: kustomization/*/overlays/dev
          - path: kustomization/broker/overlays/dev
            exclude: true
          - path: kustomization/infrastructure/overlays/dev
            exclude: true
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-dev'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io/foreground
      annotations:
        notifications.argoproj.io/subscribe.on-sync-failed.telegram: "5166072488"
        notifications.argoproj.io/subscribe.on-sync-degraded.telegram: "5166072488"
        notifications.argoproj.io/subscribe.on-deployed.telegram: "5166072488"
    spec:
      project: services-project

      source:
        repoURL: https://github.com/InchanterX/kuber_education.git
        targetRevision: main
        path: 'kustomization/{{ index .path.segments 1 }}/overlays/dev'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}-dev'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas