apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default

  source:
    repoURL: https://github.com/InchanterX/kuber_education.git
    targetRevision: main
    path: kustomization/infrastructure/overlays/dev

  destination:
    name: in-cluster
    namespace: infrastructure-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
  info:
    - name: "Infrastructure:"
      value: "https://github.com/InchanterX/kuber_education/infrastructure"