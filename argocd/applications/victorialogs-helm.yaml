apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victorialogs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default

  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-logs-cluster
    targetRevision: 0.2.8
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-stack

  revisionHistoryLimit: 10

  info:
    - name: 'victoria-logs-cluster:'
      value: 'https://github.com/VictoriaMetrics/helm-charts/charts/victoria-logs-cluster'

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m