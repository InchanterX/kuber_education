apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
spec:
  limits: # список лимитов
    - type: Pod # лимиты для пода (сумма лимитов всех контейнеров)
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 200m
        memory: 6Mi
    - type: Container # лимиты конкретного контейнера
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 100m
        memory: 4Mi
      default: # значение limits по умолчанию
        cpu: 300m
        memory: 200Mi
      defaultRequest: # значение requests по умолчанию
        cpu: 200m
        memory: 100Mi
    - type: PersistentVolumeClaim # лимит размера хранилища PVC
      min:
        storage: 1Gi
      max:
        storage: 10Gi
