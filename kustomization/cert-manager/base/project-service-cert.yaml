apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: project-svc-cert
  namespace: project-service-dev
spec:
  secretName: project-svc-tls
  dnsNames:
    - project-service.project-service-dev.svc.cluster.local
  issuerRef:
    name: project-svc-issuer
    kind: ClusterIssuer